<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KKUMURAGI</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: #f5f5f2;
        color: #222;
        font-family: Arial, sans-serif;
      }
      .home {
        width: min(100%, 640px);
        text-align: center;
      }
      .site-title {
        margin: 0 0 32px;
        font-size: clamp(2rem, 6vw, 3rem);
        letter-spacing: 0.12em;
      }
      .app-table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        box-shadow: 0 8px 28px rgb(0 0 0 / 8%);
      }
      .app-table th,
      .app-table td {
        padding: 18px 20px;
        border-bottom: 1px solid #e7e7e3;
        text-align: left;
      }
      .app-table th {
        background: #292929;
        color: #fff;
        font-size: 0.9rem;
        font-weight: 600;
      }
      .app-row {
        cursor: pointer;
        transition: background-color 140ms ease, transform 140ms ease;
      }
      .app-row:hover,
      .app-row:focus-visible {
        background: #ecece7;
        outline: none;
      }
      .app-row:active { background: #deded7; }
      .app-row td:first-child { width: 110px; color: #68685f; }
    </style>
  </head>
  <body>
    <main class="home">
      <h1 class="site-title">KKUMURAGI</h1>
      <table class="app-table" aria-label="Apps">
        <thead>
          <tr>
            <th scope="col">No.</th>
            <th scope="col">App</th>
          </tr>
        </thead>
        <tbody>
          <tr class="app-row" role="link" tabindex="0" aria-label="Open Pang Teojyo">
            <td>01</td>
            <td>Pang Teojyo</td>
          </tr>
        </tbody>
      </table>
    </main>
    <script>
      const appRow = document.querySelector('.app-row');
      const openApp = () => { window.location.href = 'app_pangteojyo.html'; };
      appRow.addEventListener('click', openApp);
      appRow.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openApp();
        }
      });
    </script>
  </body>
</html>
